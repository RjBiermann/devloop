name: 99-ci
# Evidence-gated `verify` (required status check on main).
# Repo-agnostic: the gate is the adopting repo's OWN script (.github/verify.sh);
# no default python/tests path (that was devloop-specific and silently green
# through tee's exit code — see the pipefail bug fixed 2026-10-14).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: |
          mkdir -p evidence
          {
            echo "== bash =="; bash --version | head -1
            echo "== git =="; git --version
          } >> evidence/tool-versions.txt 2>&1
      - name: Gate — run the repo's own check (.github/verify.sh)
        shell: bash
        run: |
          set -o pipefail
          if [ ! -f .github/verify.sh ]; then
            echo "99-ci: no .github/verify.sh — this repo's gate script is missing." >&2
            echo "Add one that runs your repo's real check (e.g. delegate to config.toml pipeline.verify)." >&2
            exit 1
          fi
          bash .github/verify.sh 2>&1 | tee evidence/verify.log
          # pipefail set above: a failing gate fails this step even when tee succeeds.
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: evidence/
          if-no-files-found: error
