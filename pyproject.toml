[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devloop"
version = "0.3.15"
description = "Forge-agnostic framework for AI-native development: human spec, AI build, human merge."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
devloop = "devloop.cli:main"

[tool.setuptools.packages.find]
include = ["devloop*"]
