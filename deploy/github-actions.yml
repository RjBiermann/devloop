# devloop on GitHub: label events, comment commands, and schedule fire runs.
# Requires: agent CLI (e.g. pi) + gh authenticated in the runner.
name: devloop
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]
  push:
    branches: [master]   # edit to your default branch — a push to main
                         # immediately runs upkeep (rebase stale PRs,
                         # rebuild on conflict) instead of waiting for
                         # the 30-min sweep
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"   # self-healing: pending labels survive skipped/failed runs

concurrency:
  group: devloop-pipeline
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      # reserved ai- prefix is the contract (ADR-0003): a config rename
      # within the ai- namespace never orphans the trigger — the workflow
      # filter never hardcodes label names
      startsWith(github.event.label.name, 'ai-') ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        startsWith(github.event.pull_request.head.ref, 'devloop/')) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install devloop  # or: pip install git+https://github.com/YOURORG/devloop
      - name: Run pipeline
        if: github.event_name != 'issue_comment'
        run: devloop once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run comment command
        if: github.event_name == 'issue_comment'
        run: devloop command
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Close out merged devloop PR's issue
        if: github.event_name == 'pull_request'
        run: devloop merged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
